<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Country Explorer</title>
    <link rel="preconnect" href="https://restcountries.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="masthead" aria-labelledby="page-title">
        <div>
          <p class="eyebrow">REST API Dashboard</p>
          <h1 id="page-title">Country Explorer</h1>
          <p class="intro">
            Browse live country data from REST Countries, then narrow results by
            search and region.
          </p>
        </div>
        <div class="summary-panel" aria-live="polite">
          <span class="summary-number" id="country-count">0</span>
          <span class="summary-label">countries loaded</span>
        </div>
      </section>

      <section class="controls" aria-label="Country filters">
        <label class="field">
          <span>Search</span>
          <input
            id="search-input"
            type="search"
            placeholder="Name, capital, or region"
            autocomplete="off"
          />
        </label>

        <label class="field">
          <span>Region</span>
          <select id="region-filter">
            <option value="all">All regions</option>
          </select>
        </label>

        <button class="refresh-button" id="refresh-button" type="button">
          Refresh
        </button>
      </section>

      <section id="status" class="status" aria-live="polite"></section>

      <section
        id="countries-grid"
        class="countries-grid"
        aria-label="Countries"
      ></section>
    </main>

    <template id="country-card-template">
      <article class="country-card">
        <img class="flag" alt="" loading="lazy" />
        <div class="country-body">
          <div>
            <p class="region"></p>
            <h2></h2>
          </div>
          <dl class="facts">
            <div>
              <dt>Capital</dt>
              <dd class="capital"></dd>
            </div>
            <div>
              <dt>Population</dt>
              <dd class="population"></dd>
            </div>
            <div>
              <dt>Currency</dt>
              <dd class="currency"></dd>
            </div>
          </dl>
        </div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
